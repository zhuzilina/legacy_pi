<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG布局（特殊样式曲线）</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }
        svg {
            display: block;
            background-color: #FFFFFF;
        }
    </style>
</head>
<body>

    <svg id="mySVG" width="100%" height="100%"></svg>

    <script>
        const svg = document.getElementById('mySVG');

        const config = {
            numberOfPoints: 10,
            pointRadius: 8,
            pointFillColor: '#FFFFFF',
            pointBorderColor: '#808080',
            pointBorderWidth: 2,
            specialPointFillColor: '#FFF8E1', 
            specialPointBorderColor: '#DC3545',
            lineColor: '#808080',
            specialLineColor: '#F5B7B1',
            curveTension: 0.4,
            contentWidthPercent: 0.8,
            distributionStdDevPercent: 0.15,
            maxHorizontalChangePercent: 0.2, 
            debounceTime: 150
        };

        // 辅助函数：正态分布随机数生成器（与Canvas版本相同）
        let spareNormal = null;
        function generateNormalRandom(mean, stdDev) {
            let u, v, s, val;
            if (spareNormal !== null) { val = spareNormal; spareNormal = null; }
            else {
                do { u = Math.random() * 2 - 1; v = Math.random() * 2 - 1; s = u * u + v * v; }
                while (s >= 1 || s === 0);
                const mul = Math.sqrt(-2.0 * Math.log(s) / s);
                val = u * mul; spareNormal = v * mul;
            }
            return val * stdDev + mean;
        }

        // 主绘制函数
        function drawLayout() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            // 清空SVG内容
            svg.innerHTML = ''; 

            const contentWidth = width * config.contentWidthPercent;
            const marginX = (width - contentWidth) / 2;
            const ySpacing = height / (config.numberOfPoints + 1);
            const centerX = width / 2;
            const stdDevPixels = width * config.distributionStdDevPercent;
            const maxHorizontalChangePixels = width * config.maxHorizontalChangePercent;

            const points = [];
            let previousX = null;
            for (let i = 1; i <= config.numberOfPoints; i++) {
                const y = i * ySpacing; let x;
                do {
                    x = generateNormalRandom(centerX, stdDevPixels);
                } while ( x < marginX || x > marginX + contentWidth || (previousX !== null && Math.abs(x - previousX) > maxHorizontalChangePixels) );
                points.push({ x, y });
                previousX = x;
            }

            // 绘制曲线
            if (points.length > 1) {
                const dynamicLineWidth = Math.max(1, config.pointRadius * 2 - 4);

                for (let i = 0; i < points.length - 1; i++) {
                    const p0 = (i > 0) ? points[i - 1] : points[i];
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const p3 = (i < points.length - 2) ? points[i + 2] : p2;

                    const cp1x = p1.x + (p2.x - p0.x) / 6 * config.curveTension;
                    const cp1y = p1.y + (p2.y - p0.y) / 6 * config.curveTension;
                    const cp2x = p2.x - (p3.x - p1.x) / 6 * config.curveTension;
                    const cp2y = p2.y - (p3.y - p1.y) / 6 * config.curveTension;

                    // 创建 SVG <path> 元素
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    const d = `M ${p1.x} ${p1.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2.x} ${p2.y}`;
                    path.setAttribute('d', d);
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke-width', dynamicLineWidth);

                    // 根据索引判断使用哪种颜色
                    if (i >= points.length - 3) {
                        path.setAttribute('stroke', config.specialLineColor);
                    } else {
                        path.setAttribute('stroke', config.lineColor);
                    }
                    
                    svg.appendChild(path);
                }
            }
            
            // 绘制点
            for (let i = 0; i < points.length; i++) {
                const point = points[i];

                // 创建 SVG <circle> 元素
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', point.x);
                circle.setAttribute('cy', point.y);
                circle.setAttribute('r', config.pointRadius);
                circle.setAttribute('stroke-width', config.pointBorderWidth);

                // 根据索引设置特殊样式
                if (i >= points.length - 3) {
                    circle.setAttribute('fill', config.specialPointFillColor);
                    circle.setAttribute('stroke', config.specialPointBorderColor);
                } else {
                    circle.setAttribute('fill', config.pointFillColor);
                    circle.setAttribute('stroke', config.pointBorderColor);
                }
                
                svg.appendChild(circle);
            }
        }

        // 窗口大小调整事件监听（与Canvas版本相同）
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(drawLayout, config.debounceTime);
        });

        // 初始绘制
        drawLayout();
    </script>

</body>
</html>
